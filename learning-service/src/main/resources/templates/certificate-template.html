<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Certificate of Completion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            color: #333;
        }
        .certificate {
            border: 10px solid #005A9C;
            padding: 50px;
            margin: 20px;
            width: 800px;
            height: 550px;
            display: inline-block;
        }
        .header {
            font-size: 40px;
            font-weight: bold;
            color: #005A9C;
            margin-bottom: 20px;
        }
        .sub-header {
            font-size: 20px;
            margin-bottom: 40px;
        }
        .student-name {
            font-size: 30px;
            font-weight: bold;
            font-style: italic;
            border-bottom: 2px solid #333;
            display: inline-block;
            padding-bottom: 5px;
            margin-bottom: 30px;
        }
        .course-name {
            font-size: 25px;
            font-weight: bold;
            color: #005A9C;
            margin-bottom: 40px;
        }
        .footer {
            font-size: 16px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="certificate">
        <div class="header">CERTIFICATE OF COMPLETION</div>
        <div class="sub-header">This is to certify that</div>
        <div class="student-name" th:text="${studentName}">Student Name</div>
        <div class="sub-header">has successfully completed the course</div>
        <div class="course-name" th:text="${courseName}">Course Name</div>
        <div class="footer">
            <p>Date: <span th:text="${issueDate}">01/01/2026</span></p>
            <p>Certificate Code: <span th:text="${certificateCode}">CERT-XXXX</span></p>
            <br/><br/>
            <p>___________________________</p>
            <p>Instructor Signature</p>
        </div>
    </div>
</body>
</html>
